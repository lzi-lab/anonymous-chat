<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B1026" />
    <link rel="icon" type="image/svg+xml" href="/anonymous-chat/favicon.svg" />
    <title>星空匿名聊天室</title>
  </head>
  <body>
    <div class="sky" aria-hidden="true"></div>

    <!-- 畫面一：輸入代號 -->
    <main id="join-screen" class="screen join">
      <form id="join-form" class="card" novalidate>
        <h1 class="brand"><span class="star">✦</span> 星空匿名聊天室</h1>
        <p class="lead">不用註冊，取個代號就能聊天</p>
        <label class="sr-only" for="nick-input">你的代號</label>
        <input
          id="nick-input"
          name="nick"
          type="text"
          autocomplete="off"
          enterkeyhint="go"
          placeholder="你的代號（1～12 字）"
        />
        <p id="join-error" class="error" role="alert"></p>
        <button id="join-btn" class="btn-primary" type="submit">進入聊天室</button>
        <p id="join-mode" class="mode-note" hidden></p>
      </form>
    </main>

    <!-- 畫面二：聊天室 -->
    <div id="chat-screen" class="screen chat" hidden>
      <header class="topbar">
        <h1 class="brand small"><span class="star">✦</span> 星空匿名聊天室</h1>
        <button id="online-toggle" class="online-toggle" type="button" aria-expanded="false" aria-controls="online-panel">
          <span class="dot" aria-hidden="true"></span>
          <span id="online-count">0 人在線</span>
          <span class="caret" aria-hidden="true">▾</span>
        </button>
        <button id="leave-btn" class="btn-ghost" type="button">離開</button>
      </header>

      <div id="status-bar" class="status-bar" role="status" hidden></div>

      <div class="chat-body">
        <section class="messages-wrap">
          <ol id="messages" class="messages" role="log" aria-live="polite" aria-label="聊天訊息">
          </ol>
        </section>
        <aside id="online-panel" class="online-panel" aria-label="線上名單">
          <h2 id="online-title">線上 0 人</h2>
          <ul id="online-list" class="online-list"></ul>
        </aside>
      </div>

      <form id="composer" class="composer" novalidate>
        <label class="sr-only" for="msg-input">輸入訊息</label>
        <div class="input-wrap">
          <textarea id="msg-input" rows="1" placeholder="輸入訊息…" enterkeyhint="enter"></textarea>
          <span id="char-count" class="char-count">0/500</span>
        </div>
        <button id="send-btn" class="btn-primary send" type="submit" disabled>送出</button>
      </form>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
